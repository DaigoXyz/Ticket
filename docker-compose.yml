services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ticket-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "cacingTanaHugetugetaowk9@1u4#2"
      TZ: "Asia/Jakarta"
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql

  ticketapp:
    build: .
    container_name: ticket-app
    ports:
      - "5182:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      TZ: "Asia/Jakarta"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=EntryTicket;User Id=sa;Password=cacingTanaHugetugetaowk9@1u4#2;TrustServerCertificate=True;Encrypt=False;"
      DataProtection__KeysFolder: "/app/keys"
    depends_on:
      - sqlserver
    volumes:
      - dp_keys:/app/keys

volumes:
  sql_data:
  dp_keys:
